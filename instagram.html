<html>
<head>
    <title>Instagram Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .main {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 560px;
            padding: 40px;
            text-align: center;
        }

        h2 {
            text-align: left;
            font-size: 20px;
            margin-bottom: 24px;
            color: #262626;
        }

        input {
            width: 100%;
            height: 64px;
            padding: 0 18px;
            margin-bottom: 14px;
            border: 1px solid #dbdbdb;
            border-radius: 16px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border: 2px solid #0095f6;
        }

        input:hover {
            border: 2px solid #0095f6;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #0077c8;
        }

        .forgot {
            display: block;
            margin: 26px 0;
            color: #262626;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .line {
            border-top: 1px solid #dbdbdb;
            margin: 25px 0;
        }

        .create-btn {
            width: 100%;
            height: 48px;
            background-color: white;
            color: #0095f6;
            border: 1px solid #0095f6;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:hover {
            background-color: #f0f8ff;
        }
    </style>
</head>

<body>

    <div class="main">

        <form class="login-box">

            <h2>Log in to Instagram</h2>

            <input type="text" placeholder="Phone number, username, or email">

            <input type="password" placeholder="Password">

            <button type="submit" class="login-btn">
                Log in
            </button>

            <a href="#" class="forgot">
                Forgotten password?
            </a>

            <div class="line"></div>

            <button type="button" class="create-btn">
                Create new account
            </button>

        </form>

    </div>

</body>
</html>
